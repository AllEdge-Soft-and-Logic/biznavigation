<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation - Vehicle Master</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- Upgraded Modern Form Styles -->
    <link rel="stylesheet" href="../../assets/css/booking-theme.css" />

    <!-- Core Scripts (Deferred) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">

                <div class="container-fluid mt-3 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <form id="customsClearanceForm" autocomplete="off" novalidate>

                                <!-- Action Bar -->
                                <div
                                    class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                    <h5 class="m-0 fw-bold text-dark d-none d-md-block">Vehicle Master</h5>
                                    <div class="d-flex flex-wrap gap-2">
                                        <button type="button" class="btn btn-outline-primary btn-sm bg-white"
                                            id="newButton" title="Create new booking">
                                            <i class="bi bi-file-earmark-plus"></i> New
                                        </button>
                                        <button type="button" class="btn btn-outline-warning btn-sm bg-white"
                                            id="modifyButton" disabled title="Modify booking">
                                            <i class="bi bi-pencil"></i> Modify
                                        </button>
                                        <button type="button" class="btn btn-outline-danger btn-sm bg-white"
                                            id="deleteButton" disabled title="Delete booking">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                        <button type="button" class="btn btn-outline-info btn-sm bg-white"
                                            id="reportButton" disabled title="Print booking">
                                            <i class="bi bi-printer"></i> Print
                                        </button>
                                        <button type="button" class="btn btn-primary btn-sm px-4 shadow-sm"
                                            id="saveButton" data-mode="insert" title="Save booking">
                                            <i class="bi bi-check2-circle"></i> Save
                                        </button>
                                    </div>

                                    <!-- Form State & Meta Tracking -->
                                    <input type="hidden" id="status" name="status" value="New" />
                                    <input type="hidden" id="tempFormID" name="tempFormID" />
                                    <input type="hidden" id="partyCode" name="partyCode" />
                                    <input type="hidden" id="serviceProviderCode" name="serviceProviderCode" />
                                </div>

                                <!-- Main Details Grid -->
                                <div class="row g-3">
                                    <!-- Vehicle Code -->
                                    <div class="col-xl-1 col-md-3 col-sm-6">
                                        <label for="vehicleCode" class="form-label">Code</label>
                                        <input type="text" id="vehicleCode" name="vehicleCode"
                                            class="form-control text-upper" disabled />
                                    </div>
                                    <!-- Registration No. -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="regNumber" class="form-label">Registration No</label>
                                        <div class="input-group">
                                            <input list="regNumberSuggestions" id="regNumber" name="regNumber"
                                                class="form-control input-highlight fw-bold"
                                                placeholder="e.g. KA-01-AB-1234" autocomplete="off" required />
                                            <button type="button" class="btn btn-outline-secondary btn-sm bg-white"
                                                data-bs-toggle="modal" data-bs-target="#searchVehicleModal">
                                                <i class="bi bi-search"></i>
                                            </button>
                                        </div>
                                        <datalist id="regNumberSuggestions"></datalist>
                                    </div>

                                    <!-- Chassis Number -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="chassisNumber" class="form-label">Chassis Number</label>
                                        <input type="text" id="chassisNumber" name="chassisNumber"
                                            class="form-control text-upper" placeholder="17-character VIN" required />
                                    </div>
                                    <!-- Engine Number -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="engineNumber" class="form-label">Engine Number</label>
                                        <input type="text" id="engineNumber" name="engineNumber"
                                            class="form-control text-uppercase" placeholder="17-character VIN"
                                            maxlength="17" autocomplete="off" required />
                                    </div>
                                    <!-- Make / Manufacturer -->
                                    <div class="col-xl-2 col-md-6 col-sm-12">
                                        <label for="make" class="form-label">Make / Manufacturer</label>
                                        <input list="makeSuggestions" id="make" name="make" class="form-control"
                                            placeholder="e.g. Tata, Volvo" autocomplete="off" required />
                                        <datalist id="makeSuggestions"></datalist>
                                    </div>

                                    <!-- Model -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="model" class="form-label">Model</label>
                                        <input type="text" id="model" name="model" class="form-control text-upper"
                                            placeholder="e.g. 407, FH16" required />
                                    </div>
                                    <!-- Year -->
                                    <div class="col-xl-1 col-md-3 col-sm-6">
                                        <label for="makeYear" class="form-label">Years</label>
                                        <input type="number" id="makeYear" name="makeYear"
                                            class="form-control text-upper" placeholder="Year" required />
                                    </div>

                                    <!-- Vehicle Type (Select) -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="vehicleType" class="form-label">Vehicle Type</label>
                                        <select id="vehicleType" name="vehicleType" class="form-select" required>
                                            <option value="Truck">Truck</option>
                                            <option value="Van">Van</option>
                                            <option value="Trailer">Trailer</option>
                                            <option value="Bus">Bus</option>
                                            <option value="Sedan">Car / Sedan</option>
                                        </select>
                                    </div>

                                    <!-- Fuel Type -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="fuelType" class="form-label">Fuel Type</label>
                                        <select id="fuelType" name="fuelType" class="form-select" required>
                                            <option value="Diesel">Diesel</option>
                                            <option value="Petrol">Petrol</option>
                                            <option value="EV">Electric</option>
                                            <option value="CNG">CNG</option>
                                        </select>
                                    </div>

                                    <!-- Load Capacity -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="loadCapacity" class="form-label">Load Capacity (kg)</label>
                                        <input type="number" id="loadCapacity" name="loadCapacity" min="0" step="any"
                                            class="form-control text-end" placeholder="e.g. 2500" required />
                                    </div>

                                    <!-- Operational Status -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="operationalStatus" class="form-label">Operational Status</label>
                                        <select id="operationalStatus" name="operationalStatus" class="form-select"
                                            required>
                                            <option value="Active">Active</option>
                                            <option value="Maintenance">Under Maintenance</option>
                                            <option value="Inactive">Inactive</option>
                                        </select>
                                    </div>

                                    <!-- Owner / Consignor Name -->
                                    <div class="col-xl-4 col-md-6 col-sm-12">
                                        <label for="partyName" class="form-label">Owner Name</label>
                                        <input list="partySuggestions" id="partyName" name="partyName"
                                            class="form-control" placeholder="Choose owner..." autocomplete="off"
                                            required />
                                        <datalist id="partySuggestions"></datalist>
                                    </div>

                                    <!-- Category / Body Type List -->
                                    <div class="col-xl-2 col-md-3 col-sm-6">
                                        <label for="vehicleTypeList" class="form-label">Vehicle Sub-Type</label>
                                        <input list="vehicleTypeSuggestions" id="vehicleTypeList" name="vehicleTypeList"
                                            class="form-control" placeholder="Choose..." autocomplete="off" required />
                                        <datalist id="vehicleTypeSuggestions"></datalist>
                                    </div>

                                    <!-- Additional Notes -->
                                    <div class="col-10">
                                        <label for="information" class="form-label">Information / Remarks</label>
                                        <input type="text" id="information" name="information" class="form-control"
                                            placeholder="Enter operational notes or clearance remarks" />
                                    </div>
                                </div>

                                <!-- Tabbed Sections -->
                                <div class="col-12 mt-4">
                                    <ul class="nav nav-tabs" id="vehicleMasterTabs" role="tablist">
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link active" id="documents-tab" data-bs-toggle="tab"
                                                data-bs-target="#documents" type="button" role="tab"
                                                aria-controls="documents" aria-selected="true">
                                                <i class="bi bi-file-earmark-text me-1"></i> Documents
                                            </button>
                                        </li>
                                    </ul>

                                    <div class="tab-content" id="vehicleMasterTabsContent">
                                        <!-- Documents Tab Pane -->
                                        <div class="tab-pane fade show active" id="documents" role="tabpanel"
                                            aria-labelledby="documents-tab">
                                            <div class="row g-2 align-items-end mb-3">
                                                <div class="col-md-4 col-sm-6">
                                                    <label for="documentTypeInput" class="form-label">Document
                                                        Type</label>
                                                    <input list="documentTypeList" id="documentTypeInput"
                                                        class="form-control"
                                                        placeholder="Select or enter document type" />
                                                    <datalist id="documentTypeList"></datalist>
                                                </div>

                                                <div class="col-md-3 col-sm-6">
                                                    <label for="documentNumber" class="form-label">Document
                                                        Number</label>
                                                    <input type="text" id="documentNumber" class="form-control"
                                                        placeholder="e.g. RC-98765432" />
                                                </div>

                                                <div class="col-md-2 col-sm-6">
                                                    <label for="validUpTo" class="form-label">Valid Up To</label>
                                                    <input type="date" id="validUpTo" class="form-control" />
                                                </div>
                                                <div class="col-md-2 col-sm-6">
                                                    <label for="documentFile" class="form-label">Select File (PDF, PNG,
                                                        JPG)</label>
                                                    <input type="file" id="documentFile" class="form-control"
                                                        accept=".pdf,.png,.jpg,.jpeg" />
                                                </div>
                                                <div class="col-md-1 col-sm-6">
                                                    <button type="button" id="addDocumentButton"
                                                        class="btn btn-outline-primary w-100">
                                                        <i class="bi bi-plus-circle"></i> Add
                                                    </button>
                                                </div>
                                            </div>

                                            <div class="table-container">
                                                <table id="chargesTable" class="table table-hover">
                                                    <thead>
                                                        <tr>
                                                            <th>Document Type</th>
                                                            <th>Document Number</th>
                                                            <th>Valid Up To</th>
                                                            <th>Attached Document</th>
                                                            <th class="text-center">Action</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="documentTableBody">
                                                        <!-- Dynamic rows added here -->
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>

                            <!-- SEARCH SAVED VEHICLES MODAL -->
                            <div class="modal fade" id="searchVehicleModal" tabindex="-1"
                                aria-labelledby="searchVehicleModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                    <div class="modal-content">

                                        <!-- Modal Header -->
                                        <div class="modal-header bg-primary text-white">
                                            <h5 class="modal-title" id="searchVehicleModalLabel">
                                                <i class="bi bi-search"></i> Search Saved Vehicles
                                            </h5>
                                            <button type="button" class="btn-close btn-close-white"
                                                data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>

                                        <!-- Modal Body -->
                                        <div class="modal-body">
                                            <!-- Search Input Box -->
                                            <div class="input-group mb-3">
                                                <input type="text" id="searchSavedVehicleInput" class="form-control"
                                                    placeholder="Search by Registration No, Owner Name, Make or Model..."
                                                    autocomplete="off">
                                                <button class="btn btn-outline-primary" type="button"
                                                    id="btnTriggerSearch">
                                                    <i class="bi bi-search"></i> Search
                                                </button>
                                            </div>

                                            <!-- Search Results Table -->
                                            <div class="table-responsive">
                                                <table
                                                    class="table table-sm table-hover table-bordered align-middle text-center">
                                                    <thead class="table-light">
                                                        <tr>
                                                            <th>Registration No</th>
                                                            <th>Owner Name</th>
                                                            <th>Vehicle Type</th>
                                                            <th>Model</th>
                                                            <th>Make</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="searchVehicleTableBody">
                                                        <tr>
                                                            <td colspan="6"
                                                                class="text-center text-muted fst-italic py-3">
                                                                Enter search criteria to find vehicles...
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <!-- Modal Footer -->
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary btn-sm"
                                                data-bs-dismiss="modal">Close</button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0 shadow" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="errorToastMessage">Error message here...</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- External Library Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" defer
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Local Scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/pincode-helper.js" defer></script>
    <script src="../../assets/js/utils/taxDescription.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>
</body>

</html>
