<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Payment report with credit and debit details, filters, sorting and export." />
    <meta name="theme-color" content="#2563eb" />
    <title>Payment Report - Credit &amp; Debit</title>

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">

    <!-- Libs (deferred, execute in document order) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"
        defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4" defer></script>

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- Upgraded Modern Report Styles (Unified) -->
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #root {
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        /* Card Styling */
        .card {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02) !important;
            background-color: var(--surface-color);
        }

        .card-body {
            padding: 1.5rem 2rem !important;
        }

        /* Action Bar */
        .action-bar {
            padding-bottom: 1.25rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            font-weight: 500;
            border-radius: 6px;
            padding: 0.4rem 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
        }

        .btn-sm {
            font-size: 0.85rem;
        }

        /* Form Controls */
        .form-label {
            margin-bottom: 0.3rem !important;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control,
        .form-select {
            padding: 0.45rem 0.75rem !important;
            font-size: 0.875rem !important;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-control:hover,
        .form-select:hover {
            border-color: #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        /* Filter Panel */
        .filter-panel {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        /* Table Container */
        .table-responsive {
            max-height: 500px;
            overflow: auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            -webkit-overflow-scrolling: touch;
        }

        #paymentTable {
            width: 100%;
            min-width: 880px;
            /* keeps columns readable on mobile -> horizontal scroll */
            table-layout: fixed;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        #paymentTable th,
        #paymentTable td {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #paymentTable th:nth-child(1),
        #paymentTable td:nth-child(1),
        #paymentTable th:nth-child(3),
        #paymentTable td:nth-child(3) {
            text-align: center;
        }

        #paymentTable th:nth-child(2),
        #paymentTable td:nth-child(2),
        #paymentTable th:nth-child(4),
        #paymentTable td:nth-child(4),
        #paymentTable th:nth-child(5),
        #paymentTable td:nth-child(5) {
            text-align: left;
        }

        #paymentTable th:nth-child(n+6),
        #paymentTable td:nth-child(n+6) {
            text-align: right;
        }

        .container-fluid {
            min-width: 0;
        }

        /* Header */
        #paymentTable thead th {
            position: sticky;
            top: 0;
            z-index: 11;
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 0.7rem 0.75rem !important;
            border-bottom: 1px solid var(--border-color);
            border-top: none;
            border-left: none;
            border-right: none;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        #paymentTable thead th:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        #paymentTable thead th:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: -2px;
        }

        /* Sort indicator driven by aria-sort (set this from your JS) */
        #paymentTable thead th[aria-sort]::after {
            content: "";
            display: inline-block;
            margin-left: 0.35rem;
            border: 4px solid transparent;
            vertical-align: middle;
            opacity: 0.35;
        }

        #paymentTable thead th[aria-sort="ascending"]::after {
            border-bottom-color: currentColor;
            opacity: 1;
        }

        #paymentTable thead th[aria-sort="descending"]::after {
            border-top-color: currentColor;
            opacity: 1;
        }

        /* Body */
        #paymentTable tbody td {
            vertical-align: middle;
            font-size: 0.82rem;
            padding: 0.6rem 0.75rem !important;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-left: none;
            border-right: none;
        }

        #paymentTable tbody tr:last-child td {
            border-bottom: none;
        }

        #paymentTable tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Column widths — preserved */
        #paymentTable th:nth-child(1),
        #paymentTable td:nth-child(1) {
            width: 70px;
        }

        #paymentTable th:nth-child(2),
        #paymentTable td:nth-child(2) {
            width: 120px;
        }

        #paymentTable th:nth-child(3),
        #paymentTable td:nth-child(3) {
            width: 110px;
        }

        #paymentTable th:nth-child(4),
        #paymentTable td:nth-child(4) {
            width: 180px;
        }

        #paymentTable th:nth-child(5),
        #paymentTable td:nth-child(5) {
            width: 130px;
        }

        #paymentTable th:nth-child(n+6),
        #paymentTable td:nth-child(n+6) {
            width: 120px;
        }

        /* Empty / loading state row */
        #paymentTable tbody tr.table-empty td {
            text-align: center !important;
            color: var(--text-muted);
            padding: 2.5rem 1rem !important;
            font-size: 0.85rem;
        }

        /* Custom Scrollbar */
        .table-responsive::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Pagination */
        .pagination {
            gap: 4px;
            flex-wrap: wrap;
        }

        .pagination .page-link {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 6px !important;
            transition: var(--transition);
        }

        .pagination .page-link:hover {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-color: #bfdbfe;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        .pagination .page-item.disabled .page-link {
            background-color: #f8fafc;
            color: #cbd5e1;
            border-color: var(--border-color);
        }

        /* Loading Spinner */
        #loadingSpinner .spinner-border {
            width: 2.5rem;
            height: 2.5rem;
            border-width: 0.2rem;
            color: var(--primary-color) !important;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            #paymentTable thead th {
                font-size: 0.68rem;
                padding: 0.5rem 0.6rem !important;
            }

            #paymentTable tbody td {
                font-size: 0.75rem;
                padding: 0.5rem 0.6rem !important;
            }

            .card-body {
                padding: 1rem 1.25rem !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">

                <div class="container-fluid mt-3 mb-4" id="root">
                    <div class="card">
                        <div class="card-body">

                            <!-- Action Bar -->
                            <div class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                <h5 class="m-0 fw-bold text-dark d-none d-md-block">Payment Report</h5>
                                <button class="btn btn-outline-primary btn-sm bg-white" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#filterSection" aria-expanded="false"
                                    aria-controls="filterSection">
                                    <i class="bi bi-funnel" aria-hidden="true"></i> Toggle Filters
                                </button>
                            </div>

                            <!-- Filters Section -->
                            <div class="collapse" id="filterSection">
                                <div class="filter-panel">
                                    <div class="row g-3" id="searchFilters">
                                        <div class="col-12 col-md-6 col-lg-3">
                                            <label for="customerName" class="form-label">Customer Name</label>
                                            <input id="customerName" class="form-control" list="customerNameList"
                                                placeholder="Enter Customer Name" autocomplete="off" spellcheck="false">
                                            <datalist id="customerNameList"></datalist>
                                        </div>
                                        <div class="col-12 col-md-6 col-lg-3">
                                            <label for="paymentNo" class="form-label">Payment No</label>
                                            <input id="paymentNo" class="form-control" list="paymentNoList"
                                                placeholder="Enter Payment No" autocomplete="off" spellcheck="false">
                                            <datalist id="paymentNoList"></datalist>
                                        </div>

                                        <div class="col-12 col-md-6 col-lg-3">
                                            <label for="invoiceNo" class="form-label">Invoice No</label>
                                            <input id="invoiceNo" class="form-control" list="invoiceNoList"
                                                placeholder="Enter Invoice No" autocomplete="off" spellcheck="false">
                                            <datalist id="invoiceNoList"></datalist>
                                        </div>

                                        <div class="col-6 col-md-6 col-lg-3">
                                            <label for="dateRange" class="form-label">Payment Date Range</label>
                                            <input id="dateRange" class="form-control" placeholder="Select Date Range"
                                                readonly autocomplete="off">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label for="paymentMonth" class="form-label">Payment Month</label>
                                            <input type="month" id="paymentMonth" class="form-control">
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <label for="paymentYear" class="form-label">Payment Year</label>
                                            <input type="number" id="paymentYear" class="form-control"
                                                placeholder="YYYY" min="2000" max="2100" step="1" inputmode="numeric">
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <label for="financialYear" class="form-label">Financial Year</label>
                                            <input id="financialYear" class="form-control" placeholder="YYYY-YYYY"
                                                list="financialYearList" autocomplete="off">
                                            <datalist id="financialYearList"></datalist>
                                        </div>
                                        <div class="col-6 col-md-2 col-lg-2 d-grid align-self-end">
                                            <button class="btn btn-primary" id="searchBtn" type="button">
                                                <i class="bi bi-search" aria-hidden="true"></i> Search
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Spinner -->
                            <div id="loadingSpinner" class="text-center my-4 hidden" role="status" aria-live="polite">
                                <div class="spinner-border" aria-hidden="true"></div>
                                <p class="text-muted mt-2 small mb-0">Loading payment records...</p>
                            </div>

                            <!-- Table -->
                            <div class="table-responsive">
                                <table class="table" id="paymentTable">
                                    <thead>
                                        <tr>
                                            <th scope="col" data-key="RowID">Sr No</th>
                                            <th scope="col" data-key="DocketNo">Payment No</th>
                                            <th scope="col" data-key="BookedDate">Payment Date</th>
                                            <th scope="col" data-key="CustomerName">Customer Name</th>
                                            <th scope="col" data-key="Narration">Narration</th>
                                            <th scope="col" data-key="Credit">Credit</th>
                                            <th scope="col" data-key="Debit">Debit</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>

                            <!-- Pagination & Export -->
                            <div
                                class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-3">
                                <nav aria-label="Payment report pagination">
                                    <ul class="pagination mb-0" id="paginationControls"></ul>
                                </nav>
                                <div class="d-flex flex-wrap gap-2">
                                    <button class="btn btn-outline-success btn-sm bg-white" id="exportExcelBtn"
                                        type="button" disabled>
                                        <i class="bi bi-file-earmark-excel" aria-hidden="true"></i> Export to Excel
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm bg-white" id="exportPdfBtn"
                                        type="button" disabled>
                                        <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Export to PDF
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- App Scripts (defer keeps order after the CDN libs above) -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>
    <script src="../../assets/js/Report/rep_PaymentDetails.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
</body>

</html>
