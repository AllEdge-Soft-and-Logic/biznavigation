<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pickup Request Report">
    <title>Pickup Request</title>

    <!-- Preconnect Resource Hints for Performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonts & Core Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

    <!-- Custom Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <!-- Deferred Scripts (Non-blocking rendering) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <!-- Added missing SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"
        defer></script>

    <!-- Upgraded Modern Report Styles -->
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        /* Card Styling */
        .card {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02) !important;
            background-color: var(--surface-color);
        }

        .card-body {
            padding: 1.5rem 2rem !important;
        }

        /* Action Bar */
        .action-bar {
            padding-bottom: 1.25rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            font-weight: 500;
            border-radius: 6px;
            padding: 0.4rem 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
        }

        .btn-sm {
            font-size: 0.85rem;
        }

        /* Form Controls */
        .form-label {
            margin-bottom: 0.3rem !important;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control,
        .form-select {
            padding: 0.45rem 0.75rem !important;
            font-size: 0.875rem !important;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-control:hover,
        .form-select:hover {
            border-color: #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        /* Filter Panel */
        .filter-panel {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        /* Table Container & Custom Scrollbar */
        .table-responsive {
            max-height: 500px;
            overflow: auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .table-responsive::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        #requestTable {
            width: 100%;
            min-width: 1400px;
            /* Forces a horizontal scrollbar on smaller screens to respect column widths */
            table-layout: fixed;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        /* Table Alignment & Text Wrapping */
        #requestTable th,
        #requestTable td {
            white-space: normal;
            /* Allows text to wrap to the next line */
            word-wrap: break-word;
            /* Breaks long continuous words if necessary */
            overflow-wrap: break-word;
            vertical-align: top;
            /* Aligns text to the top for better readability on wrapped lines */
            padding: 0.75rem !important;
            /* Slightly more padding for wrapped text */
        }

        #requestTable th:nth-child(1),
        #requestTable td:nth-child(1),
        #requestTable th:nth-child(3),
        #requestTable td:nth-child(3) {
            text-align: center;
        }

        #requestTable th:nth-child(2),
        #requestTable td:nth-child(2),
        #requestTable th:nth-child(4),
        #requestTable td:nth-child(4),
        #requestTable th:nth-child(5),
        #requestTable td:nth-child(5) {
            text-align: left;
        }

        #requestTable th:nth-child(n+6),
        #requestTable td:nth-child(n+6) {
            text-align: right;
        }

        /* Adjusted Column Widths based on expected content length */
        #requestTable th:nth-child(1) {
            width: 70px;
        }

        /* Sr No & Toggle */
        #requestTable th:nth-child(2) {
            width: 150px;
        }

        /* Request No */
        #requestTable th:nth-child(3) {
            width: 110px;
        }

        /* Request Date */
        #requestTable th:nth-child(4) {
            width: 220px;
        }

        /* Customer Name (Wider for wrapping) */
        #requestTable th:nth-child(5) {
            width: 130px;
        }

        /* Movement Type */
        #requestTable th:nth-child(6) {
            width: 150px;
        }

        /* Assigned To */
        #requestTable th:nth-child(7) {
            width: 250px;
        }

        /* Notes (Wider for wrapping) */
        #requestTable th:nth-child(8) {
            width: 110px;
        }

        /* Status */
        #requestTable th:nth-child(9) {
            width: 120px;
        }

        /* Created By */
        #requestTable th:nth-child(10) {
            width: 250px;
        }

        /* Canceled Notes (Wider for wrapping) */

        /* Header */
        #requestTable thead th {
            position: sticky;
            top: 0;
            z-index: 11;
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 0.7rem 0.75rem !important;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        #requestTable thead th:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        /* Body */
        #requestTable tbody td {
            vertical-align: middle;
            font-size: 0.82rem;
            padding: 0.6rem 0.75rem !important;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        #requestTable tbody tr:last-child td {
            border-bottom: none;
        }

        #requestTable tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Column widths */
        #requestTable th:nth-child(1) {
            width: 70px;
        }

        #requestTable th:nth-child(2) {
            width: 120px;
        }

        #requestTable th:nth-child(3) {
            width: 110px;
        }

        #requestTable th:nth-child(4) {
            width: 180px;
        }

        #requestTable th:nth-child(5) {
            width: 130px;
        }

        #requestTable th:nth-child(n+6) {
            width: 120px;
        }

        /* Pagination */
        .pagination {
            gap: 4px;
        }

        .pagination .page-link {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 6px !important;
            transition: var(--transition);
        }

        .pagination .page-link:hover {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-color: #bfdbfe;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        .pagination .page-item.disabled .page-link {
            background-color: #f8fafc;
            color: #cbd5e1;
            border-color: var(--border-color);
        }

        /* Mobile Responsive Tweaks */
        @media (max-width: 768px) {
            #requestTable thead th {
                font-size: 0.68rem;
                padding: 0.5rem 0.6rem !important;
            }

            #requestTable tbody td {
                font-size: 0.75rem;
                padding: 0.5rem 0.6rem !important;
            }

            .card-body {
                padding: 1rem 1.25rem !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-wrapper d-flex">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar-wrapper">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content flex-grow-1 w-100">
            <div class="page-content container-fluid mt-3 mb-4" id="root">
                <div class="card">
                    <div class="card-body">

                        <!-- Action Bar -->
                        <header class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                            <h1 class="h5 m-0 fw-bold text-dark d-none d-md-block">Pickup Request</h1>
                            <button class="btn btn-outline-primary btn-sm bg-white" type="button"
                                data-bs-toggle="collapse" data-bs-target="#filterSection" aria-expanded="false"
                                aria-controls="filterSection" aria-label="Toggle search filters">
                                <i class="bi bi-funnel" aria-hidden="true"></i> Toggle Filters
                            </button>
                        </header>

                        <!-- Filters Section -->
                        <section class="collapse" id="filterSection">
                            <div class="filter-panel">
                                <div class="row g-3" id="searchFilters">
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="customerName" class="form-label">Customer Name</label>
                                        <input id="customerName" class="form-control" list="customerNameList"
                                            placeholder="Enter Customer Name">
                                        <datalist id="customerNameList"></datalist>
                                    </div>
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="RequestNo" class="form-label">Request No</label>
                                        <input id="RequestNo" class="form-control" list="RequestNoList"
                                            placeholder="Enter Request No">
                                        <datalist id="RequestNoList"></datalist>
                                    </div>
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="shipmentNo" class="form-label">Shipment No</label>
                                        <input id="shipmentNo" class="form-control" list="shipmentNoList"
                                            placeholder="Enter Shipment No">
                                        <datalist id="shipmentNoList"></datalist>
                                    </div>
                                    <div class="col-6 col-md-6 col-lg-3">
                                        <label for="dateRange" class="form-label">Request Date Range</label>
                                        <input id="dateRange" class="form-control" placeholder="Select Date Range"
                                            readonly>
                                    </div>
                                    <div class="col-6 col-md-4 col-lg-2">
                                        <label for="paymentMonth" class="form-label">Request Month</label>
                                        <input type="month" id="paymentMonth" class="form-control">
                                    </div>
                                    <div class="col-6 col-md-4 col-lg-2">
                                        <label for="paymentYear" class="form-label">Request Year</label>
                                        <input type="number" id="paymentYear" class="form-control" placeholder="YYYY"
                                            min="2000" max="2100">
                                    </div>
                                    <div class="col-6 col-md-4 col-lg-3">
                                        <label for="financialYear" class="form-label">Financial Year</label>
                                        <input id="financialYear" class="form-control" placeholder="YYYY-YYYY"
                                            list="financialYearList">
                                        <datalist id="financialYearList"></datalist>
                                    </div>
                                    <div class="col-6 col-md-12 col-lg-2 d-grid align-self-end">
                                        <button class="btn btn-primary" id="searchBtn">
                                            <i class="bi bi-search" aria-hidden="true"></i> Search
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="text-center my-4 hidden" aria-live="polite">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading records...</span>
                            </div>
                            <p class="text-muted mt-2 small mb-0">Loading request records...</p>
                        </div>

                        <!-- Data Table -->
                        <div class="table-responsive">
                            <table class="table" id="requestTable" aria-label="Pickup Requests Table">
                                <thead>
                                    <tr>
                                        <th scope="col" data-key="RowID">Sr No</th>
                                        <th scope="col" data-key="RequestNo">Request No</th>
                                        <th scope="col" data-key="RequestDate">Request Date</th>
                                        <th scope="col" data-key="CustomerName">Customer Name</th>
                                        <th scope="col" data-key="MovementType">Movement Type</th>
                                        <th scope="col" data-key="AssignedToPerson">Assigned To</th>
                                        <th scope="col" data-key="Notes">Notes</th>
                                        <th scope="col" data-key="Status">Status</th>
                                        <th scope="col" data-key="CreatedBy">Created By</th>
                                        <th scope="col" data-key="CanceledNotes">Canceled Notes</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic Data Populated via JS -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination & Export Actions -->
                        <footer
                            class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-3">
                            <nav aria-label="Table pagination">
                                <ul class="pagination mb-0" id="paginationControls"></ul>
                            </nav>
                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn btn-outline-success btn-sm bg-white" id="exportExcelBtn" disabled>
                                    <i class="bi bi-file-earmark-excel" aria-hidden="true"></i> Export to Excel
                                </button>
                                <button class="btn btn-outline-danger btn-sm bg-white" id="exportPdfBtn" disabled>
                                    <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Export to PDF
                                </button>
                            </div>
                        </footer>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- App Scripts (Deferred in head, placed here to guarantee load order if module structures require it) -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>
    <script src="../../assets/js/Report/rep_PickupRequest.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
</body>

</html>
