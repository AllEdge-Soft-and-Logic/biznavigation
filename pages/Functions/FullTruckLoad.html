<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizNavigation - Full Truck Load</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar CSS (Assuming external existence) -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- Upgraded Modern Form Styles -->
    <link rel="stylesheet" href="../../assets/css/booking-theme.css" />

    <!-- Core Scripts (Deferred) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">

                <div class="container-fluid mt-3 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <form id="fullTruckLoadForm" autocomplete="off">

                                <!-- Action Bar -->
                                <div
                                    class="action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                    <h5 class="m-0 fw-bold text-dark d-none d-md-block">Full Truck Load Booking</h5>
                                    <div class="d-flex flex-wrap gap-2">
                                        <button type="button" class="btn btn-outline-primary btn-sm bg-white"
                                            id="newButton" title="Create new booking">
                                            <i class="bi bi-file-earmark-plus"></i> New
                                        </button>
                                        <button type="button" class="btn btn-outline-warning btn-sm bg-white"
                                            id="modifyButton" disabled title="Modify booking">
                                            <i class="bi bi-pencil"></i> Modify
                                        </button>
                                        <button type="button" class="btn btn-outline-danger btn-sm bg-white"
                                            id="deleteButton" disabled title="Delete booking">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                        <button type="button" class="btn btn-outline-info btn-sm bg-white"
                                            id="reportButton" disabled>
                                            <i class="bi bi-printer"></i> LR Print
                                        </button>
                                        <button type="button" class="btn btn-primary btn-sm px-4 shadow-sm"
                                            id="saveButton" data-mode="insert" title="Save booking">
                                            <i class="bi bi-check2-circle"></i> Save
                                        </button>
                                    </div>

                                    <input type="hidden" id="tempFormID" name="tempFormID">
                                    <input type="hidden" id="partyCode" name="partyCode">
                                    <input type="hidden" id="vendorCode" name="vendorCode">
                                </div>

                                <!-- Form Grid -->
                                <div class="row g-3">
                                    <!-- Row 1 -->
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="lrNumber" class="form-label">LR Number</label>
                                        <input list="lrNumberSuggestions" id="lrNumber" name="lrNumber"
                                            class="form-control input-highlight fw-bold" autocomplete="off"
                                            placeholder="Search LR..." />
                                        <datalist id="lrNumberSuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="lrDate" class="form-label">LR Date</label>
                                        <input type="date" id="lrDate" name="lrDate" class="form-control" />
                                    </div>
                                    <div class="col-lg-4 col-md-6 col-sm-12">
                                        <label for="partyName" class="form-label">Customer Name</label>
                                        <input list="partySuggestions" class="form-control" id="partyName"
                                            name="partyName" required placeholder="Choose Customer..."
                                            autocomplete="off">
                                        <datalist id="partySuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="requestedDate" class="form-label">Requested Date</label>
                                        <input type="date" id="requestedDate" name="requestedDate"
                                            class="form-control" />
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="quotationID" class="form-label">Quotation ID</label>
                                        <input list="quotationIDSuggestions" type="text" id="quotationID"
                                            name="quotationID" class="form-control" placeholder="Optional" />
                                        <datalist id="quotationIDSuggestions"></datalist>
                                    </div>

                                    <!-- Row 2 -->
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="modeType" class="form-label">Mode Type</label>
                                        <select class="form-select" id="modeType" name="modeType">
                                            <option value="" disabled selected>Select Mode</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="movementType" class="form-label">Movement Type</label>
                                        <select class="form-select" id="movementType" name="movementType" required>
                                            <option value="" disabled selected>Select Movement</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="originPinCode" class="form-label">Pickup Pincode</label>
                                        <input type="text" class="form-control" id="originPinCode" name="originPinCode"
                                            list="originPinCodeSuggestions" required autocomplete="off"
                                            placeholder="Enter Pincode">
                                        <datalist id="originPinCodeSuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="originCity" class="form-label">Pickup City</label>
                                        <input type="text" id="originCity" name="originCity"
                                            class="form-control text-cap" required autocomplete="off">
                                    </div>
                                    <div class="col-lg-4 col-md-12 col-sm-12">
                                        <label for="originAddress" class="form-label">Pickup Address</label>
                                        <textarea id="originAddress" class="form-control text-cap" name="originAddress"
                                            required rows="1" autocomplete="off" placeholder="Full Address"></textarea>
                                    </div>

                                    <!-- Hidden Destination Row (unchanged functionality, just standardized spacing) -->
                                    <div class="col-md-2 col-sm-6 d-none">
                                        <label for="destinationPinCode" class="form-label">Delivery Pincode</label>
                                        <input type="text" id="destinationPinCode" name="destinationPinCode" required
                                            autocomplete="off" class="form-control" list="destinationPinCodeSuggestions"
                                            placeholder="Pincode">
                                        <datalist id="destinationPinCodeSuggestions"></datalist>
                                    </div>
                                    <div class="col-md-2 col-sm-6 d-none">
                                        <label for="destinationCity" class="form-label">Delivery City</label>
                                        <input type="text" id="destinationCity" name="destinationCity"
                                            class="form-control text-cap bg-light" required autocomplete="off" readonly>
                                    </div>
                                    <div class="col-md-4 col-sm-6 d-none">
                                        <label for="destinationAddress" class="form-label">Delivery Address</label>
                                        <textarea id="destinationAddress" class="form-control text-cap"
                                            name="destinationAddress" required rows="1" autocomplete="off"
                                            placeholder="Full Address"></textarea>
                                    </div>
                                    <div class="col-md-2 col-sm-6 d-none">
                                        <label for="referenceNumber" class="form-label">Reference No</label>
                                        <input type="text" class="form-control text-upper" id="referenceNumber"
                                            name="referenceNumber" required autocomplete="off" maxlength="50">
                                    </div>
                                    <div class="col-md-2 col-sm-6 d-none">
                                        <label for="invoiceValue" class="form-label">Invoice Value</label>
                                        <input type="number" class="form-control text-end" id="invoiceValue"
                                            name="invoiceValue" min="0" step="0.01" placeholder="0.00"
                                            onblur="formatCurrency(this)">
                                    </div>

                                    <!-- Row 4 -->
                                    <div class="col-lg-4 col-md-4 col-sm-12">
                                        <label for="vendorName" class="form-label">Vendor Name</label>
                                        <input list="vendorSuggestions" class="form-control" id="vendorName"
                                            name="vendorName" required placeholder="Select Vendor" autocomplete="off">
                                        <datalist id="vendorSuggestions"></datalist>
                                    </div>
                                    <div class="col-lg-2 col-md-4 col-sm-6">
                                        <label for="vehicleType" class="form-label">Vehicle Type</label>
                                        <select class="form-select" id="vehicleType" name="vehicleType">
                                            <option value="" disabled selected>Select Vehicle</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-2 col-md-4 col-sm-6">
                                        <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                                        <input type="text" class="form-control text-upper" id="vehicleNumber"
                                            name="vehicleNumber" required autocomplete="off"
                                            placeholder="e.g. KA01AA1234">
                                    </div>
                                    <div class="col-lg-2 col-md-6 col-sm-6">
                                        <label for="containerNumber" class="form-label">Container No</label>
                                        <input type="text" class="form-control text-upper" id="containerNumber"
                                            name="containerNumber" autocomplete="off" placeholder="Optional">
                                        <div id="containerFeedback" class="invalid-feedback d-none"></div>
                                    </div>
                                    <div class="col-lg-2 col-md-6 col-sm-6">
                                        <label for="quantity" class="form-label">Quantity</label>
                                        <input type="number" class="form-control text-end bg-light" id="quantity"
                                            name="quantity" min="0" step="1.00" placeholder="0" required readonly>
                                    </div>

                                    <!-- Row 5 -->
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="actualWt" class="form-label">Actual Wt (Kgs)</label>
                                        <input type="number" class="form-control text-end bg-light" id="actualWt"
                                            name="actualWt" min="0" step="0.50" placeholder="0.00" required readonly>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="chargeWt" class="form-label">Charge Wt (Kgs)</label>
                                        <input type="number" class="form-control text-end bg-light" id="chargeWt"
                                            name="chargeWt" min="0" step="0.50" placeholder="0.00" required readonly>
                                    </div>
                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                        <label for="mainPaymentType" class="form-label">Payment Type</label>
                                        <select class="form-select" id="mainPaymentType" name="mainPaymentType"
                                            required>
                                            <option value="" disabled selected>Select Payment</option>
                                            <option value="To-Pay">To-Pay</option>
                                            <option value="Paid">Paid</option>
                                            <option value="TBB">TBB</option>
                                            <option value="Credit">Credit</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-6 col-md-12 col-sm-12">
                                        <label for="routeDetails" class="form-label">Route Details</label>
                                        <input list="routeSuggestions" class="form-control" id="routeDetails"
                                            name="routeDetails" required placeholder="Select Route" autocomplete="off">
                                        <datalist id="routeSuggestions"></datalist>
                                    </div>
                                    <div class="col-12">
                                        <label for="information" class="form-label">Additional Information</label>
                                        <input type="text" class="form-control" id="information" name="information"
                                            placeholder="Enter any additional remarks or information">
                                    </div>

                                    <!-- Tabbed Form Section -->
                                    <div class="col-12 mt-4">
                                        <ul class="nav nav-tabs" id="bookingTabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="shipmentDetails-tab"
                                                    data-bs-toggle="tab" data-bs-target="#shipmentDetails" type="button"
                                                    role="tab">Shipment Details</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="freightCharges-tab" data-bs-toggle="tab"
                                                    data-bs-target="#freightCharges" type="button" role="tab">Customer
                                                    Charges</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="vendorCharges-details-tab"
                                                    data-bs-toggle="tab" data-bs-target="#vendorCharges" type="button"
                                                    role="tab">Vendor Charges</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="description-tab" data-bs-toggle="tab"
                                                    data-bs-target="#description" type="button"
                                                    role="tab">Description</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="status-tab" data-bs-toggle="tab"
                                                    data-bs-target="#status" type="button" role="tab">Status</button>
                                            </li>
                                        </ul>

                                        <div class="tab-content" id="bookingTabsContent">

                                            <!-- Shipment Details Tab -->
                                            <div class="tab-pane fade show active" id="shipmentDetails" role="tabpanel">
                                                <div class="row g-2 align-items-end mb-3">
                                                    <input type="hidden" id="shipmentId" value="">
                                                    <div class="col-lg-1 col-md-2 col-sm-6">
                                                        <label for="shipmentType" class="form-label">Type</label>
                                                        <select class="form-select" id="shipmentType"
                                                            name="shipmentType" required>
                                                            <option value="Delivery">Delivery</option>
                                                            <option value="Pickup">Pickup</option>
                                                        </select>
                                                    </div>
                                                    <div class="col-lg-3 col-md-4 col-sm-6">
                                                        <label for="consigneeorConsignorName"
                                                            class="form-label">Consignee/Consignor</label>
                                                        <input list="consigneeorConsignorNameList" class="form-control"
                                                            id="consigneeorConsignorName"
                                                            name="consigneeorConsignorName" required placeholder="Name"
                                                            autocomplete="off">
                                                        <datalist id="consigneeorConsignorNameList"></datalist>
                                                    </div>
                                                    <div class="col-lg-4 col-md-6 col-sm-12">
                                                        <label for="consigneeorConsignorAddress"
                                                            class="form-label">Address</label>
                                                        <textarea id="consigneeorConsignorAddress"
                                                            class="form-control text-cap"
                                                            name="consigneeorConsignorAddress" required rows="1"
                                                            autocomplete="off" placeholder="Address"></textarea>
                                                    </div>
                                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                                        <label for="shipmentPinCode" class="form-label">Pincode</label>
                                                        <input type="text" id="shipmentPinCode" name="shipmentPinCode"
                                                            required autocomplete="off" class="form-control"
                                                            list="shipmentPinCodeSuggestions" placeholder="Pincode">
                                                        <datalist id="shipmentPinCodeSuggestions"></datalist>
                                                    </div>
                                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                                        <label for="shipmentCity" class="form-label">City</label>
                                                        <input type="text" id="shipmentCity" name="shipmentCity"
                                                            class="form-control text-cap bg-light" required
                                                            autocomplete="off">
                                                    </div>
                                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                                        <label for="shipmentReferenceNumber" class="form-label">Ref
                                                            No</label>
                                                        <input type="text" class="form-control text-upper"
                                                            id="shipmentReferenceNumber" name="shipmentReferenceNumber"
                                                            required autocomplete="off" maxlength="50"
                                                            placeholder="Reference">
                                                    </div>
                                                    <div class="col-lg-2 col-md-3 col-sm-6">
                                                        <label for="shipmentInvoiceValue" class="form-label">Invoice
                                                            Value</label>
                                                        <input type="number" class="form-control text-end"
                                                            id="shipmentInvoiceValue" name="shipmentInvoiceValue"
                                                            min="0" step="0.01" placeholder="0.00">
                                                    </div>
                                                    <div class="col-lg-2 col-md-2 col-sm-4">
                                                        <label for="shipmentQuantity"
                                                            class="form-label">Quantity</label>
                                                        <input type="number" class="form-control text-end"
                                                            id="shipmentQuantity" name="shipmentQuantity" min="0"
                                                            step="0.01" placeholder="0.00" required>
                                                    </div>
                                                    <div class="col-lg-2 col-md-2 col-sm-4">
                                                        <label for="shipmentActualWt" class="form-label">Actual
                                                            Wt</label>
                                                        <input type="number" class="form-control text-end"
                                                            id="shipmentActualWt" name="shipmentActualWt" min="0"
                                                            step="0.50" placeholder="0.00" required>
                                                    </div>
                                                    <div class="col-lg-2 col-md-2 col-sm-4">
                                                        <label for="shipmentChargeWt" class="form-label">Charge
                                                            Wt</label>
                                                        <input type="number" class="form-control text-end"
                                                            id="shipmentChargeWt" name="shipmentChargeWt" min="0"
                                                            step="0.50" placeholder="0.00" required>
                                                    </div>
                                                    <div class="col-lg-2 col-md-12 text-end">
                                                        <button type="button" id="addShipmentRow"
                                                            class="btn btn-outline-primary w-100">
                                                            <i class="bi bi-plus-circle"></i> Add Item
                                                        </button>
                                                    </div>
                                                </div>

                                                <div id="shipmentDetailsTableContainer" class="table-container">
                                                    <table id="shipmentDetailsTable" class="table table-hover">
                                                        <thead>
                                                            <tr>
                                                                <th>Type</th>
                                                                <th>Name</th>
                                                                <th>Address</th>
                                                                <th>Pincode</th>
                                                                <th>City</th>
                                                                <th>Ref No</th>
                                                                <th>Inv Value</th>
                                                                <th>Qty</th>
                                                                <th>Act Wt</th>
                                                                <th>Chg Wt</th>
                                                                <th class="text-center">Action</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <!-- Dynamic rows added here -->
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <!-- Customer Freight Charges Tab -->
                                            <div class="tab-pane fade" id="freightCharges" role="tabpanel">
                                                <div class="row g-2 align-items-end mb-3">
                                                    <div class="col-lg-4 col-md-5 col-sm-12 text-start">
                                                        <label for="chargesType" class="form-label">Charges Type</label>
                                                        <input list="chargesTypeList" id="chargesType"
                                                            name="chargesType" class="form-control"
                                                            placeholder="Select or type charges">
                                                        <datalist id="chargesTypeList"></datalist>
                                                    </div>
                                                    <div class="col-lg-3 col-md-3 col-sm-6 text-start">
                                                        <label for="customerFreightAmt"
                                                            class="form-label">Amount</label>
                                                        <input type="number" id="customerFreightAmt"
                                                            name="customerFreightAmt" class="form-control text-end"
                                                            min="0" step="0.01" value="0.00" placeholder="0.00">
                                                    </div>
                                                    <div class="col-lg-3 col-md-4 col-sm-6 text-start">
                                                        <label for="partyDefaultTax" class="form-label">Tax Rate</label>
                                                        <select id="partyDefaultTax" name="partyDefaultTax"
                                                            class="form-select">
                                                            <option value="" disabled selected>Select Tax</option>
                                                        </select>
                                                    </div>
                                                    <div class="col-lg-2 col-md-12 text-end">
                                                        <button type="button" id="addFreightRow"
                                                            class="btn btn-outline-primary w-100">
                                                            <i class="bi bi-plus-circle"></i> Add Charge
                                                        </button>
                                                    </div>
                                                </div>

                                                <div id="chargesDetailsTableContainer" class="table-container">
                                                    <table id="chargesDetailsTable" class="table table-hover">
                                                        <thead>
                                                            <tr>
                                                                <th>Charges Type</th>
                                                                <th>GST %</th>
                                                                <th>Amount</th>
                                                                <th>CGST</th>
                                                                <th>SGST</th>
                                                                <th>IGST</th>
                                                                <th>Total GST</th>
                                                                <th>Grand Total</th>
                                                                <th class="text-center">Action</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody></tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <!-- Vendor Freight Charges Tab -->
                                            <div class="tab-pane fade" id="vendorCharges" role="tabpanel">
                                                <div class="row g-2 align-items-end mb-3">
                                                    <div class="col-lg-4 col-md-5 col-sm-12 text-start">
                                                        <label for="vendorChargesType" class="form-label">Charges
                                                            Type</label>
                                                        <input list="vendorChargesTypeList" id="vendorChargesType"
                                                            name="vendorChargesType" class="form-control"
                                                            placeholder="Select or type charges">
                                                        <datalist id="vendorChargesTypeList"></datalist>
                                                    </div>
                                                    <div class="col-lg-3 col-md-3 col-sm-6 text-start">
                                                        <label for="vendorFreightAmt" class="form-label">Amount</label>
                                                        <input type="number" id="vendorFreightAmt"
                                                            name="vendorFreightAmt" class="form-control text-end"
                                                            min="0" step="0.01" value="0.00" placeholder="0.00">
                                                    </div>
                                                    <div class="col-lg-3 col-md-4 col-sm-6 text-start">
                                                        <label for="vendorDefaultTax" class="form-label">Tax
                                                            Rate</label>
                                                        <select id="vendorDefaultTax" name="vendorDefaultTax"
                                                            class="form-select">
                                                            <option value="" disabled selected>Select Tax</option>
                                                        </select>
                                                    </div>
                                                    <div class="col-lg-2 col-md-12 text-end">
                                                        <button type="button" id="addVendorFreightRow"
                                                            class="btn btn-outline-primary w-100">
                                                            <i class="bi bi-plus-circle"></i> Add Charge
                                                        </button>
                                                    </div>
                                                </div>

                                                <div id="vendorChargesDetailsTableContainer" class="table-container">
                                                    <table id="vendorChargesDetailsTable" class="table table-hover">
                                                        <thead>
                                                            <tr>
                                                                <th>Charges Type</th>
                                                                <th>GST %</th>
                                                                <th>Amount</th>
                                                                <th>CGST</th>
                                                                <th>SGST</th>
                                                                <th>IGST</th>
                                                                <th>Total GST</th>
                                                                <th>Grand Total</th>
                                                                <th class="text-center">Action</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody></tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <!-- Description Tab -->
                                            <div class="tab-pane fade" id="description" role="tabpanel">
                                                <div class="row g-3">
                                                    <div class="col-md-6 col-sm-12 text-start">
                                                        <label for="descriptionofGoods" class="form-label">Description
                                                            of Goods</label>
                                                        <textarea class="form-control text-cap" id="descriptionofGoods"
                                                            name="descriptionofGoods" rows="3" autocomplete="off"
                                                            placeholder="Detail the goods being transported..."></textarea>
                                                    </div>
                                                    <div class="col-md-6 col-sm-12 text-start">
                                                        <label for="wayBillNo" class="form-label">E-Way Bill
                                                            Number</label>
                                                        <input type="text" class="form-control text-upper"
                                                            id="wayBillNo" name="wayBillNo" autocomplete="off"
                                                            placeholder="Enter E-Way Bill No">
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Status Tab -->
                                            <div class="tab-pane fade" id="status" role="tabpanel">
                                                <div class="row g-3">
