<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Trip Management – assign vehicles, schedule trips and track route milestones.">
    <meta name="theme-color" content="#0d6efd">
    <title>Trip Management · BizNavigation</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../../assets/css/navbar.css" />

    <!-- Upgraded Modern Form Styles -->
    <link rel="stylesheet" href="../../assets/css/booking-theme.css" />

    <!-- Page-scoped polish -->
    <style>
        .vm-action-bar {
            position: sticky;
            top: 0;
            z-index: 1020;
            padding: .75rem 0;
            margin-bottom: .5rem;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--bs-border-color-translucent, #e9ecef);
        }

        .vm-section-title {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin: 1.25rem 0 .25rem;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--bs-secondary-color, #6c757d);
        }

        .vm-section-title::after {
            content: "";
            flex: 1 1 auto;
            height: 1px;
            background: currentColor;
            opacity: .15;
        }

        .form-label .req {
            color: var(--bs-danger, #dc3545);
            margin-left: .15rem;
        }

        .form-control:disabled,
        .form-control[readonly] {
            background-color: var(--bs-tertiary-bg, #f8f9fa);
        }

        .vm-empty {
            padding: 2.5rem 1rem;
            text-align: center;
            color: var(--bs-secondary-color, #6c757d);
        }

        .vm-empty i {
            display: block;
            font-size: 1.75rem;
            opacity: .45;
            margin-bottom: .5rem;
        }

        .text-upper {
            text-transform: uppercase;
        }

        .text-cap {
            text-transform: capitalize;
        }

        .table-container {
            overflow-x: auto;
        }

        .table-container table thead th {
            font-size: .8rem;
            white-space: nowrap;
        }

        @media (max-width: 575.98px) {
            .vm-action-bar .btn {
                flex: 1 1 auto;
            }
        }
    </style>

    <!-- Core Scripts (Deferred) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
</head>

<body>
    <div class="app-wrapper">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="text-center text-muted p-3">Loading Sidebar...</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">

                <div class="container-fluid mt-3 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-body pb-3">

                            <form id="domesticBookingForm" novalidate autocomplete="off">

                                <!-- ============ ACTION BAR ============ -->
                                <div
                                    class="vm-action-bar d-flex flex-wrap gap-2 align-items-center justify-content-between">
                                    <h5 class="m-0 fw-bold text-dark d-none d-md-flex align-items-center gap-2">
                                        <i class="bi bi-signpost-split text-primary"></i>
                                        Trip Management
                                        <span class="badge rounded-pill text-bg-light border fw-normal"
                                            id="formStateBadge">New</span>
                                    </h5>

                                    <div class="d-flex flex-wrap gap-2" role="group" aria-label="Trip action buttons">
                                        <button type="button" class="btn btn-outline-primary btn-sm bg-white"
                                            id="newButton" title="Create new trip" aria-label="New trip">
                                            <i class="bi bi-file-earmark-plus"></i>
                                            <span class="d-none d-lg-inline ms-1">New</span>
                                        </button>
                                        <button type="button" class="btn btn-outline-warning btn-sm bg-white"
                                            id="modifyButton" disabled title="Modify trip" aria-label="Modify trip">
                                            <i class="bi bi-pencil"></i>
                                            <span class="d-none d-lg-inline ms-1">Modify</span>
                                        </button>
                                        <button type="button" class="btn btn-outline-danger btn-sm bg-white"
                                            id="deleteButton" disabled title="Delete trip" aria-label="Delete trip">
                                            <i class="bi bi-trash"></i>
                                            <span class="d-none d-lg-inline ms-1">Delete</span>
                                        </button>
                                        <button type="button" class="btn btn-outline-info btn-sm bg-white"
                                            id="reportButton" disabled title="Print trip" aria-label="Print trip">
                                            <i class="bi bi-printer"></i>
                                            <span class="d-none d-lg-inline ms-1">Print</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-sm px-4 shadow-sm"
                                            id="saveButton" data-mode="insert" title="Save trip">
                                            <i class="bi bi-check2-circle"></i> Save
                                        </button>
                                    </div>

                                    <!-- Hidden Inputs -->
                                    <input type="hidden" id="tempFormID" />
                                    <input type="hidden" id="partyCode" />
                                    <input type="hidden" id="consignorCode" />
                                    <input type="hidden" id="serviceProviderCode" />
                                    <input type="hidden" id="currentStatus" value="New" />
                                </div>

                                <!-- ============ TRIP & VEHICLE ============ -->
                                <p class="vm-section-title">
                                    <i class="bi bi-truck"></i> Trip &amp; Vehicle
                                </p>

                                <div class="row g-3">
                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                                        <label for="tripID" class="form-label">Trip ID</label>
                                        <input type="text" id="tripID" name="tripID"
                                            class="form-control bg-light fw-bold text-upper" readonly
                                            aria-readonly="true" />
                                    </div>

                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                                        <label for="vehicleAssigned" class="form-label">Vehicle Assigned</label>
                                        <input list="vehicleSuggestions" id="vehicleAssigned" name="vehicleAssigned"
                                            class="form-control text-upper" placeholder="Select Vehicle..."
                                            autocomplete="off" />
                                        <datalist id="vehicleSuggestions"></datalist>
                                    </div>

                                    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                                        <label for="customerName" class="form-label">
                                            Customer Name<span class="req">*</span>
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                            <input list="customerNameSuggestions" id="customerName" name="customerName"
                                                data-force-list="true" data-list-id="customerNameSuggestions"
                                                class="form-control" placeholder="Choose Customer..." autocomplete="off"
                                                required />
                                            <datalist id="customerNameSuggestions"></datalist>
                                        </div>
                                    </div>

                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                                        <label for="scheduledDeparture" class="form-label">
                                            Scheduled Departure<span class="req">*</span>
                                        </label>
                                        <input type="datetime-local" class="form-control" id="scheduledDeparture"
                                            name="scheduledDeparture" required>
                                    </div>

                                    <div class="col-xl-1 col-lg-2 col-md-4 col-sm-6">
                                        <label for="startOdometer" class="form-label">Start ODO (km)</label>
                                        <input type="number" class="form-control text-end" id="startOdometer"
                                            name="startOdometer" min="0" placeholder="0">
                                    </div>

                                    <div class="col-xl-1 col-lg-2 col-md-4 col-sm-6">
                                        <label for="endOdometer" class="form-label">End ODO (km)</label>
                                        <input type="number" class="form-control text-end" id="endOdometer"
                                            name="endOdometer" min="0" placeholder="0">
                                    </div>
                                </div>

                                <!-- ============ ORIGIN ============ -->
                                <p class="vm-section-title">
                                    <i class="bi bi-geo-alt"></i> Origin
                                </p>

                                <div class="row g-3">
                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                                        <label for="originPincode" class="form-label">
                                            Origin Pincode<span class="req">*</span>
                                        </label>
                                        <input type="text" class="form-control" id="originPincode" name="originPincode"
                                            maxlength="6" pattern="\d{6}" placeholder="e.g. 560001" required>
                                    </div>

                                    <div class="col-xl-3 col-lg-4 col-md-8 col-sm-6">
                                        <label for="originLocation" class="form-label">Origin Location</label>
                                        <input type="text" class="form-control bg-light" id="originLocation"
                                            name="originLocation" placeholder="Auto-fills from pincode..."
                                            tabindex="-1">
                                    </div>

                                    <div class="col-xl-4 col-lg-5 col-md-6 col-sm-6">
                                        <label for="consigneeName" class="form-label">
                                            Consignee<span class="req">*</span>
                                        </label>
                                        <input list="consigneeNameSuggestions" class="form-control" id="consigneeName"
                                            required placeholder="Choose Consignee..."
                                            oninput="consigneeDetails(this.value, 'ConsigneeName', 'consigneeNameSuggestions')"
                                            onchange="updateDeliveryAddress()">
                                        <datalist id="consigneeNameSuggestions"></datalist>
                                    </div>

                                    <div class="col-xl-5 col-lg-6 col-md-8 col-sm-12">
                                        <label for="newConsigneeAddress" class="form-label">
                                            Consignor Address<span class="req">*</span>
                                        </label>
                                        <textarea class="form-control text-cap" id="newConsigneeAddress" rows="1"
                                            placeholder="Full Consignor Address" required></textarea>
                                    </div>
                                </div>

                                <!-- ============ DESTINATION ============ -->
                                <p class="vm-section-title">
                                    <i class="bi bi-geo"></i> Destination
                                </p>

                                <div class="row g-3">
                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
                                        <label for="destPincode" class="form-label">
                                            Dest. Pincode<span class="req">*</span>
                                        </label>
                                        <input type="text" class="form-control" id="destPincode" name="destPincode"
                                            maxlength="6" pattern="\d{6}" placeholder="e.g. 400001" required>
                                    </div>

                                    <div class="col-xl-3 col-lg-4 col-md-8 col-sm-6">
                                        <label for="destLocation" class="form-label">Destination Location</label>
                                        <input type="text" class="form-control bg-light" id="destLocation"
                                            name="destLocation" placeholder="Auto-fills from pincode..." tabindex="-1">
                                    </div>

                                    <div class="col-xl-4 col-lg-5 col-md-8 col-sm-12">
                                        <label for="specialInstructions" class="form-label">Special Instructions / Seal
                                            Numbers</label>
                                        <input type="text" class="form-control" id="specialInstructions"
                                            name="specialInstructions"
                                            placeholder="e.g., Handle with care, Seal #12345">
                                    </div>

                                    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-12 d-grid">
                                        <button type="button" id="addFreightRow" class="btn btn-primary">
                                            <i class="bi bi-plus-circle"></i> Add
                                        </button>
                                    </div>
                                </div>

                                <!-- ============ TRIP LIST ============ -->
                                <p class="vm-section-title">
                                    <i class="bi bi-list-check"></i> Trip List
                                </p>

                                <div id="freight" class="table-container">
                                    <table class="table table-hover align-middle mb-0" id="freightTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th scope="col">Sl No</th>
                                                <th scope="col">Trip Details</th>
                                                <th scope="col">Contract / Client</th>
                                                <th scope="col">Vehicle &amp; Driver</th>
                                                <th scope="col">Route &amp; Milestones</th>
                                                <th scope="col">ETA &amp; Status</th>
                                                <th scope="col" class="text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="chargesBody">
                                            <tr>
                                                <td colspan="7" class="vm-empty">
                                                    <i class="bi bi-signpost-split"></i>
                                                    No trips recorded yet
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                            </form>

                            <!-- ============ PAGINATION ============ -->
                            <div
                                class="d-flex flex-wrap justify-content-between align-items-center mt-4 pt-3 border-top small text-secondary gap-2">
                                <p class="mb-0">Showing <span class="fw-bold text-dark">1</span> to <span
                                        class="fw-bold text-dark">3</span> of <span class="fw-bold text-dark">42</span>
                                    trips</p>
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item disabled"><button class="page-link" aria-label="Previous"><i
                                                class="bi bi-chevron-left"></i></button></li>
                                    <li class="page-item active"><button class="page-link">1</button></li>
                                    <li class="page-item"><button class="page-link">2</button></li>
                                    <li class="page-item"><button class="page-link" aria-label="Next"><i
                                                class="bi bi-chevron-right"></i></button></li>
                                </ul>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- ============ ADD CONSIGNEE MODAL ============ -->
                <div class="modal fade" id="addConsigneeModal" tabindex="-1" aria-labelledby="addConsigneeModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title" id="addConsigneeModalLabel">
                                    <i class="bi bi-person-plus me-1"></i> Add New Consignee
                                </h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <div class="modal-body">
                                <form id="consigneeForm" novalidate>
                                    <div class="mb-3">
                                        <label for="newConsigneeNameInput" class="form-label">Consignee Name<span
                                                class="req">*</span></label>
                                        <input type="text" class="form-control" id="newConsigneeNameInput"
                                            name="newConsigneeName" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newConsigneeAddressInput" class="form-label">Consignee Address<span
                                                class="req">*</span></label>
                                        <textarea class="form-control" id="newConsigneeAddressInput"
                                            name="newConsigneeAddress" rows="2" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactPerson" class="form-label">Contact Person<span
                                                class="req">*</span></label>
                                        <input type="text" class="form-control" id="newContactPerson"
                                            name="newContactPerson" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newContactNumber" class="form-label">Contact Number<span
                                                class="req">*</span></label>
                                        <input type="tel" class="form-control" id="newContactNumber"
                                            name="newContactNumber" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="newEmailID" class="form-label">Email ID<span
                                                class="req">*</span></label>
                                        <input type="email" class="form-control" id="newEmailID" name="newEmailID"
                                            required />
                                    </div>
                                </form>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick="addNewConsignee(event)">
                                    <i class="bi bi-check2-circle"></i> Add Consignee
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ============ TOASTS ============ -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999" aria-live="polite" aria-atomic="true">
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0 shadow" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-start gap-2">
                    <i class="bi bi-exclamation-triangle-fill mt-1"></i>
                    <span id="errorToastMessage">Error message here...</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="successToast" class="toast align-items-center text-white bg-success border-0 shadow" role="alert"
            aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-start gap-2">
                    <i class="bi bi-check-circle-fill mt-1"></i>
                    <span id="successToastMessage">Saved successfully.</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- External Library Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.10/purify.min.js" defer
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@supabase/supabase-js" defer></script>

    <!-- Custom Scripts -->
    <script src="../../assets/js/utils/server.js" defer></script>
    <script src="../../assets/js/utils/navbar.js" defer></script>
    <script src="../../assets/js/utils/pincode-helper.js" defer></script>
    <script src="../../assets/js/utils/taxDescription.js" defer></script>
    <script src="../../assets/js/utils/logout.js" defer></script>
    <script src="../../assets/js/utils/GlobalShortcut.js" defer></script>
    <script src="../../assets/js/utils/dropdownLoader.js" defer></script>
    <script src="../../assets/js/utils/utils.js" defer></script>

    <!-- Booking Scripts -->
    <script src="../../assets/js/DomesticBooking/Domestic.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticCharges.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticVolumetric.js" defer></script>
    <script src="../../assets/js/DomesticBooking/DomesticContainer.js" defer></script>
    <script src="../../assets/js/InternationalBooking/TariffCalculation.js" defer></script>
    <script src="../../assets/js/InternationalBooking/BookingStatus.js" defer></script>

</body>

</html>
